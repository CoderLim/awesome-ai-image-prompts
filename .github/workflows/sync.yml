name: Source index sync
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run sync && npm run build && npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/source-index
          commit-message: 'chore: refresh source index'
          title: 'Refresh source index for review'
          body: 'Metadata and source links only. Review classification, duplicates and source changes before merging.'
